name: Release

# Manual: run after the ReaPack index for the version is committed, tagged and pushed.
# Builds the manual-install zip from the tag and publishes it as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. 1.1.0beta2 (must exist on GitHub and match the manifest Version)"
        required: true
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
      prerelease: ${{ steps.normalize.outputs.prerelease }}
    steps:
      # Tags carry no "v" prefix (0.9.1, 1.0.0, 1.1.0beta1); one typed by habit is dropped.
      - name: Normalize tag input
        id: normalize
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          tag="${RAW_TAG#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # ReaPack treats any letter in a version as a pre-release.
          if [[ "$tag" =~ [A-Za-z] ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.normalize.outputs.tag }}
      - name: Verify tag matches manifest Version
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' Color/MXM_AutoColor.lua | tr -d ' \r')"
          tag="${{ steps.normalize.outputs.tag }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match manifest Version $version"
            exit 1
          fi

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
      - run: ./tests/run.sh

  release:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Validates the manifest's Provides block, then zips exactly those files.
      - name: Build package
        run: python3 .github/scripts/package.py dist

      - name: Extract changelog section
        id: changelog
        run: |
          version="${{ needs.prepare.outputs.tag }}"
          notes="$(awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            /^## \[/ && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md)"
          notes="$(printf '%s\n' "$notes" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)"
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section found for version $version"
          fi
          {
            echo "notes<<__CHANGELOG_EOF__"
            echo "$notes"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      # generate_release_notes is off: this repo merges local branches, so GitHub's generator
      # would add only a "Full Changelog" compare link. The CHANGELOG.md link points at main,
      # to resolve for every tag and show releases made after this one.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generate_release_notes: false
          body: |
            ## Reaper Auto-Color

            ${{ steps.changelog.outputs.notes }}

            📖 [CHANGELOG.md](https://github.com/michal-bartak/Reaper-AutoColor/blob/main/CHANGELOG.md) - all changes

            📦 Installation: ReaPack or Manual, see [Installation guide](https://michal-bartak.github.io/Reaper-AutoColor/installation/)
          files: dist/*.zip
